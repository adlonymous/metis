[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/paid_tool_rl", "src/metis"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/workspace.json" = "metis/data/workspace.json"
"datasets/LICENSE" = "metis/data/LICENSE"

[project]
name = "metis"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "datasets/LICENSE"]
description = "A custom RL environment for budget-constrained agentic economic decision-making"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers@16cc409ec6c6512da99238598666f83daed20c2c",
]

[project.urls]
Repository = "https://github.com/adlonymous/metis"
Issues = "https://github.com/adlonymous/metis/issues"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[project.scripts]
paid-tools-demo = "paid_tool_rl.purchase_demo:main"
metis-smoke = "metis.smoke:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
